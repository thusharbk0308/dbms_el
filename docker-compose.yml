version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chainproof_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chainproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/02_views.sql
      - ./database/functions.sql:/docker-entrypoint-initdb.d/03_functions.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chainproof"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainproof_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/chainproof
      - SECRET_KEY=chainproof_docker_secret_key_change_me_in_production_123456
      - ENVIRONMENT=production
      - DEBUG=False
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=25
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  pgdata:
  backend_uploads:
